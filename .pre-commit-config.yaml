repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        types: [python]
      - id: detect-secrets
        name: Detect secrets
        entry: detect-secrets-hook
        language: system
        types: [text]
