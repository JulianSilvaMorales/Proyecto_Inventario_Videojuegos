spring:
  application:
    name: inventario-backend
  config:
    # Lee el .env del proyecto (formato KEY=VALUE, sin comillas) al ejecutar desde
    # la raíz o desde backend/. Es opcional y las variables de entorno del sistema
    # tienen prioridad, así que Docker, CI y Render no se ven afectados.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventario}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  profiles:
    default: local
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

inventory:
  schema-model-path: ${INVENTORY_MODEL_PATH:db/model/schema-resuelto.json}
